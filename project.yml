name: unVBN
options:
  bundleIdPrefix: com.notjeremie.unvbn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Local ad-hoc signing ("Sign to Run Locally"): no Apple account needed.
    # For Developer ID distribution see README.md.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  VBNCore:
    type: framework.static
    platform: macOS
    sources: [Sources/VBNCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  unVBN:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    dependencies:
      - target: VBNCore
        embed: false
      - target: unVBNPreview
      - target: unVBNThumbnail
    settings:
      base:
        PRODUCT_NAME: unVBN
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  unVBNPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: Preview
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - target: VBNCore
        embed: false
      - sdk: Quartz.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.preview
        INFOPLIST_FILE: Preview/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Preview/unVBNPreview.entitlements

  unVBNThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Thumbnail
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - target: VBNCore
        embed: false
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.thumbnail
        INFOPLIST_FILE: Thumbnail/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Thumbnail/unVBNThumbnail.entitlements

  VBNCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/VBNCoreTests]
    dependencies:
      - target: VBNCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  unVBN:
    build:
      targets:
        unVBN: all
        VBNCoreTests: [test]
    test:
      targets: [VBNCoreTests]
