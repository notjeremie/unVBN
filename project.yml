name: unVBN
options:
  bundleIdPrefix: com.notjeremie.unvbn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Local ad-hoc signing ("Sign to Run Locally"): no Apple account needed.
    # For Developer ID distribution see README.md.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  VBNCore:
    type: framework.static
    platform: macOS
    sources: [Sources/VBNCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  VBNExport:
    type: framework.static
    platform: macOS
    sources: [Sources/VBNExport]
    dependencies:
      - target: VBNCore
        embed: false
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.export
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # Target name differs from the app's by more than case: on a case-insensitive disk `unvbn` and
  # `unVBN` would share intermediates. The product is still the `unvbn` command (Contents/Helpers/).
  unvbn-cli:
    type: tool
    platform: macOS
    sources: [CLI]
    dependencies:
      - target: VBNCore
        embed: false
      - target: VBNExport
        embed: false
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
    settings:
      base:
        PRODUCT_NAME: unvbn
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.cli
        SKIP_INSTALL: YES

  unVBN:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
      # Licence texts shipped with the app (ffmpeg is LGPL; see THIRD_PARTY_NOTICES.md).
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: licenses
        type: folder
        buildPhase: resources
    dependencies:
      - target: VBNCore
        embed: false
      - target: VBNExport
        embed: false
      - target: unvbn-cli
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: unVBNPreview
      - target: unVBNThumbnail
    settings:
      base:
        PRODUCT_NAME: unVBN
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the ffmpeg phase reads build/ffmpeg/, which may not exist
    postBuildScripts:
      # Runs before Xcode signs the app, so the nested binary is signed first (same identity/runtime).
      - name: Embed ffmpeg
        basedOnDependencyAnalysis: false
        script: |
          src="$PROJECT_DIR/build/ffmpeg/ffmpeg"
          dst="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Helpers"
          if [ ! -x "$src" ]; then
            echo "warning: build/ffmpeg/ffmpeg not found (run scripts/build-ffmpeg.sh): WebM export will be unavailable"
            exit 0
          fi
          mkdir -p "$dst"
          ditto "$src" "$dst/ffmpeg"
          xattr -c "$dst/ffmpeg"
          runtime=""; [ "${ENABLE_HARDENED_RUNTIME:-NO}" = YES ] && runtime="--options runtime"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --identifier com.notjeremie.unvbn.ffmpeg $runtime ${OTHER_CODE_SIGN_FLAGS:-} "$dst/ffmpeg"

  unVBNPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: Preview
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - target: VBNCore
        embed: false
      - sdk: Quartz.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.preview
        INFOPLIST_FILE: Preview/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Preview/unVBNPreview.entitlements

  unVBNThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Thumbnail
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - target: VBNCore
        embed: false
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.thumbnail
        INFOPLIST_FILE: Thumbnail/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Thumbnail/unVBNThumbnail.entitlements

  VBNCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/VBNCoreTests, Tests/VBNExportTests]
    dependencies:
      - target: VBNCore
        embed: false
      - target: VBNExport
        embed: false
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notjeremie.unvbn.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  unVBN:
    build:
      targets:
        unVBN: all
        VBNCoreTests: [test]
    test:
      targets: [VBNCoreTests]
