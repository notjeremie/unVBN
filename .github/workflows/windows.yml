# Builds unVBN for Windows (x64 and ARM64): the WIC codec, tested through WIC itself (regsvr32, then the MSI
# install/uninstall cycle), and the export tools (unvbn.exe, unvbn-export.exe) with their encoder tests.
# Uploads the MSIs as artifacts.
name: Windows codec

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml", "project.yml", "FORMAT.md"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml", "project.yml", "FORMAT.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            runner: windows-latest
            publish: true
          - arch: arm64
            cmake_arch: ARM64
            runner: windows-11-arm
            publish: true
          # Server 2022 has the Windows 10 shell: catches Windows 10-only Explorer behaviour (tested, not published).
          - arch: x64
            cmake_arch: x64
            runner: windows-2022
            publish: false
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version (from project.yml)
        run: |
          $v = (Select-String -Path project.yml -Pattern 'MARKETING_VERSION:\s*"([^"]+)"').Matches[0].Groups[1].Value
          while (($v -split '\.').Count -lt 3) { $v = "$v.0" }
          "VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "version $v"

      - name: vcpkg
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path "$root\vcpkg.exe")) {
            $root = "$env:RUNNER_TEMP\vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg $root
            & "$root\bootstrap-vcpkg.bat" -disableMetrics
          }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\vcpkg-cache" >> $env:GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('windows/vcpkg.json') }}

      - name: Build
        run: |
          cmake -S windows -B build -A ${{ matrix.cmake_arch }} -DUNVBN_VERSION="$env:VERSION" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.arch }}-windows-static
          if ($LASTEXITCODE) { throw "configure failed" }
          cmake --build build --config Release
          if ($LASTEXITCODE) { throw "build failed" }

      - name: Decoder tests
        run: |
          build\Release\test_decode.exe
          if ($LASTEXITCODE) { throw "decoder tests failed" }

      - name: Export tests (PNG, MP4, WebM read back and checked)
        run: |
          build\Release\export_test.exe
          if ($LASTEXITCODE) { throw "export tests failed" }

      - name: CLI smoke test
        run: |
          $dir = "$env:RUNNER_TEMP\cli fixture é"
          build\Release\export_test.exe fixture $dir
          build\Release\unvbn.exe --help | Out-Null
          if ($LASTEXITCODE) { throw "--help failed" }
          build\Release\unvbn.exe info $dir
          if ($LASTEXITCODE) { throw "info failed" }
          foreach ($f in 'png', 'mp4', 'webm') {
            build\Release\unvbn.exe $dir -f $f
            if ($LASTEXITCODE) { throw "unvbn -f $f failed" }
          }
          $parent = Split-Path $dir
          foreach ($o in 'LOGO.mp4', 'LOGO.webm', 'Intro.mp4', 'Intro.webm', 'LOGO_png\LOGO_00011.png', 'Intro_png\Intro_00004.png') {
            if (-not (Test-Path -LiteralPath "$parent\$o")) { throw "missing output $o" }
          }
          build\Release\unvbn.exe "$env:RUNNER_TEMP\does-not-exist" 2>$null
          if ($LASTEXITCODE -ne 1) { throw "a missing input must exit 1" }

      - name: WIC tests (regsvr32)
        run: |
          $dll = (Resolve-Path build\Release\unvbn_wic.dll).Path
          $p = Start-Process regsvr32 -ArgumentList '/s', "`"$dll`"" -Wait -PassThru
          if ($p.ExitCode) { throw "regsvr32 failed: $($p.ExitCode)" }
          build\Release\wic_test.exe
          if ($LASTEXITCODE) { throw "WIC tests failed" }
          $cmdKey = 'Registry::HKEY_CLASSES_ROOT\unVBN.vbnfile\shell\open\command'
          if (Test-Path "$env:ProgramFiles\Windows Photo Viewer\PhotoViewer.dll") {
            $open = (Get-ItemProperty $cmdKey).'(default)'
            Write-Host "double-click opens: $open"
            if ($open -notlike '*PhotoViewer.dll*ImageView_Fullscreen %1') { throw "no open command for .vbn" }
          } else { Write-Host "Windows Photo Viewer not present on this runner: no open command expected" }
          $p = Start-Process regsvr32 -ArgumentList '/s', '/u', "`"$dll`"" -Wait -PassThru
          if ($p.ExitCode) { throw "regsvr32 /u failed: $($p.ExitCode)" }
          build\Release\wic_test.exe --expect-missing
          if ($LASTEXITCODE) { throw "codec still registered after regsvr32 /u" }
          if (Test-Path 'Registry::HKEY_CLASSES_ROOT\unVBN.vbnfile') { throw "ProgID left behind after regsvr32 /u" }

      - name: Registry ownership (other owners kept, v0.3.0 entries migrated, nothing left)
        run: |
          $dll = (Resolve-Path build\Release\unvbn_wic.dll).Path
          function Reg([string[]]$a) {
            $p = Start-Process regsvr32 -ArgumentList (@('/s') + $a + "`"$dll`"") -Wait -PassThru
            if ($p.ExitCode) { throw "regsvr32 $a failed: $($p.ExitCode)" }
          }
          function Val($key, $name) { (Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue).$name }
          $ext = 'HKLM:\SOFTWARE\Classes\.vbn'
          $sfa = 'HKLM:\SOFTWARE\Classes\SystemFileAssociations\.vbn'
          $thumb = 'ShellEx\{e357fccd-a995-4576-b01f-234630154e96}'
          $ours = '{61B04E68-AE36-45F4-808B-0AB6CCED37DA}'
          $other = '{11111111-2222-3333-4444-555555555555}'
          function AssertClean($msg) { if ((Test-Path -LiteralPath $ext) -or (Test-Path -LiteralPath $sfa)) { throw $msg } }
          AssertClean "not clean after regsvr32 /u"

          Write-Host "-- another program already owns .vbn"
          New-Item -Path "$ext\$thumb" -Force | Out-Null
          Set-ItemProperty -LiteralPath $ext -Name '(default)' -Value 'Other.vbnfile'
          Set-ItemProperty -LiteralPath "$ext\$thumb" -Name '(default)' -Value $other
          Reg @()
          if ((Val $ext '(default)') -ne 'Other.vbnfile') { throw "default program taken over" }
          if ((Val "$ext\$thumb" '(default)') -ne $other) { throw "other thumbnail handler replaced" }
          if ($null -eq (Val "$ext\OpenWithProgids" 'unVBN.vbnfile')) { throw "not added to Open with" }
          Reg @('/u')
          if ((Val $ext '(default)') -ne 'Other.vbnfile') { throw "other default removed by unregister" }
          if ((Val "$ext\$thumb" '(default)') -ne $other) { throw "other thumbnail handler removed" }
          if (Test-Path -LiteralPath "$ext\OpenWithProgids") { throw "OpenWithProgids left behind" }
          if (Test-Path -LiteralPath $sfa) { throw "SystemFileAssociations\.vbn left behind" }
          Remove-Item -LiteralPath $ext -Recurse -Force

          Write-Host "-- upgrade from v0.3.0 (thumbnail entry and markers in .vbn)"
          New-Item -Path "$ext\$thumb" -Force | Out-Null
          Set-ItemProperty -LiteralPath $ext -Name '(default)' -Value 'unVBN.vbnfile'
          New-ItemProperty -LiteralPath $ext -Name 'unVBN.CreatedKey' -Value 1 -PropertyType DWord | Out-Null
          Set-ItemProperty -LiteralPath "$ext\$thumb" -Name '(default)' -Value $ours
          Reg @()
          if (Test-Path -LiteralPath "$ext\ShellEx") { throw "v0.3.0 thumbnail entry not removed" }
          if ($null -ne (Val $ext 'unVBN.CreatedKey')) { throw "v0.3.0 marker not removed" }
          build\Release\wic_test.exe
          if ($LASTEXITCODE) { throw "WIC tests failed after migrating v0.3.0 entries" }
          Reg @('/u')
          AssertClean "keys left behind after unregister"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build MSI
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add --global WixToolset.UI.wixext/4.0.5
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build windows/installer/unVBN.wxs -arch ${{ matrix.arch }} -ext WixToolset.UI.wixext `
            -d Version=$env:VERSION -d BinDir=build\Release -d RepoRoot="$PWD" `
            -o "dist\unVBN-windows-$env:VERSION-${{ matrix.arch }}.msi"
          if ($LASTEXITCODE) { throw "wix build failed" }

      - name: MSI install, use, uninstall
        run: |
          $msi = (Resolve-Path dist\*.msi).Path
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          $key = 'HKLM:\SOFTWARE\Classes\CLSID\{09ADE08D-D804-4C88-A367-06D3E3152893}\InprocServer32'
          $registered = (Get-ItemProperty $key).'(default)'
          Write-Host "registered DLL: $registered"
          if ($registered -notlike "*\Program Files\unVBN\unvbn_wic.dll") { throw "codec not registered from Program Files" }
          build\Release\wic_test.exe
          if ($LASTEXITCODE) { throw "WIC tests failed after MSI install" }
          $installed = "$env:ProgramFiles\unVBN"
          foreach ($f in 'unvbn.exe', 'unvbn-export.exe', 'THIRD_PARTY_NOTICES.txt') {
            if (-not (Test-Path "$installed\$f")) { throw "$f not installed" }
          }
          $envKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $path = (Get-ItemProperty $envKey).Path
          if (($path -split ';') -notcontains "$installed\") { throw "install folder not on PATH: $path" }
          $verb = 'Registry::HKEY_CLASSES_ROOT\Directory\shell\unVBN.Export\command'
          $command = (Get-ItemProperty -LiteralPath $verb).'(default)'
          Write-Host "folder verb: $command"
          if ($command -ne "`"$installed\unvbn-export.exe`" `"%1`"") { throw "folder verb wrong: $command" }
          & "$installed\unvbn.exe" --help | Out-Null
          if ($LASTEXITCODE) { throw "installed unvbn.exe failed" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', 'uninstall.log' -Wait -PassThru
          if ($p.ExitCode) { Get-Content uninstall.log -Tail 60; throw "uninstall failed: $($p.ExitCode)" }
          build\Release\wic_test.exe --expect-missing
          if ($LASTEXITCODE) { throw "codec still registered after uninstall" }
          if (Test-Path 'C:\Program Files\unVBN') { throw "install folder left behind" }
          if (Test-Path -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Directory\shell\unVBN.Export') { throw "folder verb left behind" }
          $path = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').Path
          if ($path -like '*\unVBN*') { throw "PATH entry left behind: $path" }
          foreach ($k in 'HKLM:\SOFTWARE\Classes\.vbn', 'HKLM:\SOFTWARE\Classes\SystemFileAssociations\.vbn') {
            if (Test-Path -LiteralPath $k) { throw "$k left behind after uninstall" }
          }

      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: unVBN-windows-${{ matrix.arch }}
          path: dist/*.msi
          if-no-files-found: error
